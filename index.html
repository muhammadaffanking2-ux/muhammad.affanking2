<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-bar">
        <img src="./assets/images/pokeball.svg" alt="pokeball">
        <button class="pokemon-shop">Shop Pokemon Center</button>
        <img class="second" src="./assets/images/pokeball.svg" alt="pokeball">
        <button class="pokemon-central">Visit pokemon Trainer Central</button>
        <button class="search">
            <search>Search</search>
        </button>
    </div>
    <hr>

    <div class="nav-bar">
        <img class="logo" src="./assets/images/logo.png" alt="pokemon logo">
        <a class="pokedex" href=""><button>Pokedex</button></a>
        <a class="games" href=""><button>Videogames & Apps</button></a>
        <a class="cards" href=""><button>Trading Card Game</button></a>
        <a class="merchandise" href=""><button>Merchandise</button></a>
        <a class="event" href=""><button>Play! Pokemon Events</button></a>
        <a class="anima" href=""><button>Animation</button></a>
        <a class="news" href=""><button>News</button></a>
        <a class="f-s" href=""><button>Features & Strategy</button></a>
    </div>
    <br>

    <div class="container">

        <div class="image-one">
            <img class="img-one" src="./assets/images/image1.png" alt="pokemon image">
            <p class="para-one">A mighty Mewtow promo card is waiting for you</p>
            <p class="para-two">After the release of the pokemon TCG: <i>30th Celeberation</i> visit participating
                retailors to get the gift by purchase </p>
        </div>

        <div class="image-two">
            <img class="img-two" src="./assets/images/image2.png" alt="pokemon image">
            <p class="para1">new pokemon pokopia trailer</p>
        </div>

        <div class="image-three">
            <img class="img-three" src="./assets/images/image3.png" alt="pokemon image">
            <p>halloween plush bring tricks and treats</p>

        </div>

    </div>

</body>

</html>
